name: Publish installable skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package and synthetic case
        run: python -m unittest discover -s tests -v
      - name: Package installable Skill
        shell: bash
        run: |
          mkdir -p dist/multi-channel-persona-research
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C dist/multi-channel-persona-research
          cd dist
          zip -r multi-channel-persona-research-skill.zip multi-channel-persona-research
          sha256sum multi-channel-persona-research-skill.zip > multi-channel-persona-research-skill.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/multi-channel-persona-research-skill.zip
          dist/multi-channel-persona-research-skill.zip.sha256
          --repo "${{ github.repository }}"
          --title "Multi-Channel Persona Research Skill ${{ github.ref_name }}"
          --generate-notes
